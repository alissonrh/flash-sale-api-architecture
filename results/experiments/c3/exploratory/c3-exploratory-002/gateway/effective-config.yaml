_format_version: "3.0"
_transform: true

services:
  - name: checkout-api
    url: http://api:8000
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: checkout
        paths:
          - /checkout
        methods:
          - POST
        strip_path: false
      - name: api-health
        paths:
          - /health
        methods:
          - GET
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          second: 20
          limit_by: service
          policy: local
          hide_client_headers: false
          fault_tolerant: false
