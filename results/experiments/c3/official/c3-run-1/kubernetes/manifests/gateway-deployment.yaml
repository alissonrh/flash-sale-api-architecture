apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: flash-sale
  labels:
    app: gateway
    scenario: c3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        scenario: c3
    spec:
      containers:
        - name: gateway
          image: kong:3.9.1-ubuntu
          imagePullPolicy: IfNotPresent
          env:
            - name: KONG_DATABASE
              value: 'off'
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong_dbless/kong.yml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: 127.0.0.1:8001
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ACCESS_LOG
              value: 'off'
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_LOG_LEVEL
              value: notice
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          volumeMounts:
            - name: declarative-config
              mountPath: /kong_dbless
              readOnly: true
          startupProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /status/ready
              port: status
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: declarative-config
          configMap:
            name: gateway-config
