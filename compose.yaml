services:
  postgres:
    image: postgres:18
    container_name: flash-sale-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash_sale_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: flash-sale-rabbitmq
    hostname: flash-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api:
    build: .
    container_name: flash-sale-api
    depends_on:
      - postgres
      - rabbitmq
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/flash_sale_db
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      WORKER_PROCESSING_DELAY_SECONDS: 2
    ports:
      - '8000:8000'
    restart: unless-stopped
    command: ./start-api.sh

  worker:
    build: .
    container_name: flash-sale-worker
    depends_on:
      - postgres
      - rabbitmq
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/flash_sale_db
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      WORKER_PROCESSING_DELAY_SECONDS: 2
    restart: unless-stopped
    command: ./start-worker.sh

  prometheus:
    image: prom/prometheus
    container_name: flash-sale-prometheus
    depends_on:
      - api
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
  rabbitmq_data:
