apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: flash-sale
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: flash-sale-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - api:8000
